<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Courses</title>
<meta name="theme-color" content="#2E7D4F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fredoka:wght@500;600&display=swap">
<style>
/* Layout : « marché frais » — bandeau vert feuille, liste sur une fiche blanche, fond crème, touches tomate */
:root {
  --bg: #FBF6EC;         /* fond crème */
  --surface: #FFFFFF;    /* fiche de la liste */
  --line: #ECE3D0;       /* séparateurs */
  --fg: #2B2A24;         /* texte */
  --muted: #8C8574;      /* texte secondaire, éléments cochés */
  --leaf: #2E7D4F;       /* vert feuille : actions, cases */
  --leaf-soft: #E6F2E8;  /* vert pâle : suggestions */
  --tomato: #E1543A;     /* tomate : suppression, alertes */
  --field: #FFFCF5;      /* fond des champs */
  --font: "Figtree", "Segoe UI", system-ui, sans-serif;
  --display: "Fredoka", "Figtree", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 17px/1.4 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: env(safe-area-inset-top, 0px) 32px; }
.page { max-width: 560px; margin: 0 auto; }
/* bandeau */
header { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 16px 18px; border-radius: 18px; background: var(--leaf); color: #fff; box-shadow: 0 6px 18px rgba(46,125,79,.25); }
h1 { margin: 0; font: 600 30px/1 var(--display); letter-spacing: .3px; flex: 1; }
.deco-fruits { font-size: 22px; letter-spacing: 2px; }
.etat { font-size: 12px; font-weight: 600; background: rgba(255,255,255,.18); padding: 4px 10px; border-radius: 12px; white-space: nowrap; }
.etat.alerte { background: var(--tomato); }
/* fiche de la liste */
.fiche { margin-top: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 6px 14px 10px; box-shadow: 0 2px 10px rgba(80,60,20,.06); }
ul { list-style: none; margin: 0; padding: 0; }
li.art { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 2px 0; border-bottom: 1px solid var(--line); }
li.art input[type=checkbox] { appearance: none; width: 26px; height: 26px; flex: none; margin: 0; border: 2px solid #9CC3A6; border-radius: 8px; cursor: pointer; display: grid; place-content: center; background: var(--field); transition: background .15s, border-color .15s; }
li.art input[type=checkbox]:checked { background: var(--leaf); border-color: var(--leaf); }
li.art input[type=checkbox]:checked::after { content: ""; width: 12px; height: 7px; border-left: 3px solid #fff; border-bottom: 3px solid #fff; transform: translateY(-2px) rotate(-45deg); }
li.art input[type=checkbox]:focus-visible { outline: 3px solid #9CC3A6; outline-offset: 2px; }
.txt { flex: 1; min-width: 0; background: transparent; border: none; color: var(--fg); font: 500 17px var(--font); padding: 8px 0; border-bottom: 2px solid transparent; }
.txt:focus { outline: none; border-bottom-color: #9CC3A6; }
li.coche .txt { color: var(--muted); font-weight: 400; text-decoration: line-through; }
.suppr { flex: none; width: 38px; height: 38px; border: none; background: transparent; color: #C4BBA6; font-size: 24px; line-height: 1; border-radius: 50%; cursor: pointer; }
.suppr:hover, .suppr:focus-visible { color: #fff; background: var(--tomato); outline: none; }
.ajout { display: flex; align-items: center; gap: 12px; min-height: 56px; }
.ajout .plus { width: 26px; height: 26px; flex: none; border-radius: 50%; background: var(--leaf); color: #fff; display: grid; place-items: center; font: 600 20px/1 var(--display); }
#nouveau { flex: 1; min-width: 0; background: transparent; border: none; border-bottom: 2px solid var(--line); color: var(--fg); font: inherit; padding: 10px 0; }
#nouveau::placeholder { color: var(--muted); }
#nouveau:focus { outline: none; border-bottom-color: var(--leaf); }
.sugg { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 0 6px 38px; }
.sugg:empty { display: none; }
.sugg button { border: 1px solid #CFE5D3; background: var(--leaf-soft); color: #1F5C39; font: 600 15px var(--font); padding: 7px 13px; border-radius: 18px; cursor: pointer; }
.sugg button:hover, .sugg button:focus-visible { background: var(--leaf); color: #fff; border-color: var(--leaf); outline: none; }
.sugg button small { color: var(--tomato); font-weight: 600; margin-left: 5px; }
.sugg button:hover small, .sugg button:focus-visible small { color: #FFE2D8; }
.poignee { flex: none; width: 18px; color: #C4BBA6; font-size: 20px; line-height: 1; cursor: grab; touch-action: none; user-select: none; text-align: center; padding: 10px 0; }
.poignee:hover { color: var(--leaf); }
.fleches { flex: none; display: flex; flex-direction: column; gap: 1px; }
.fl { border: none; background: transparent; color: #B5AC97; font-size: 11px; line-height: 1; width: 26px; height: 18px; border-radius: 6px; cursor: pointer; padding: 0; }
.fl:hover, .fl:focus-visible { background: var(--leaf-soft); color: var(--leaf); outline: none; }
li.titre { border-bottom: 2px solid var(--leaf); margin-top: 6px; }
li.titre .txt { font: 600 19px var(--display); color: var(--leaf); letter-spacing: .2px; }
li.titre:first-child { margin-top: 0; }
li.glisse { background: var(--leaf-soft); border-radius: 10px; box-shadow: 0 6px 16px rgba(46,125,79,.25); position: relative; z-index: 2; }
body.en-glisse, body.en-glisse * { cursor: grabbing !important; user-select: none; }
.outils-ajout { display: flex; justify-content: flex-start; padding: 2px 0 4px 38px; }
.vide { color: var(--muted); padding: 16px 0 6px 38px; font-size: 15px; }
/* éléments cochés */
.bascule { display: flex; align-items: center; gap: 12px; width: 100%; margin-top: 16px; padding: 12px 16px; border: none; border-radius: 14px; background: #F3ECDD; color: #6B6455; font: 600 16px var(--font); cursor: pointer; text-align: left; }
.bascule[aria-expanded="false"] .chev { transform: rotate(180deg); }
.bascule .chev { width: 24px; display: grid; place-items: center; height: 20px; transition: transform .15s; }
.bascule .chev::before { content: ""; width: 9px; height: 9px; border-left: 2px solid currentColor; border-top: 2px solid currentColor; transform: translateY(2px) rotate(45deg); }
#zone-coches .fiche { margin-top: 8px; }
.outils { display: flex; justify-content: flex-end; padding-top: 8px; }
.lien { background: none; border: none; color: var(--leaf); font: 600 14px var(--font); cursor: pointer; padding: 6px 0; }
.lien.rouge { color: var(--tomato); }
.confirme { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 8px; font-size: 15px; }
.confirme span { flex: 1; min-width: 180px; }
.confirme button { border: none; border-radius: 10px; padding: 8px 14px; font: 600 14px var(--font); cursor: pointer; }
.confirme .oui { background: var(--tomato); color: #fff; }
.confirme .non { background: #F3ECDD; color: var(--fg); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
/* écran de connexion */
.connexion { max-width: 400px; margin: 9vh auto 0; background: var(--surface); border: 1px solid var(--line); border-radius: 22px; overflow: hidden; box-shadow: 0 10px 30px rgba(80,60,20,.10); }
.connexion .haut { background: var(--leaf); color: #fff; text-align: center; padding: 26px 20px 22px; }
.connexion .haut h1 { font-size: 40px; }
.connexion .fruits { font-size: 30px; letter-spacing: 6px; margin-bottom: 10px; }
.connexion .sous { margin-top: 8px; font-size: 15px; opacity: .9; }
.connexion .corps { display: grid; gap: 12px; padding: 22px 22px 18px; }
.connexion label { font-size: 13px; font-weight: 600; color: #6B6455; display: grid; gap: 5px; }
.connexion input { background: var(--field); border: 1.5px solid var(--line); color: var(--fg); font: inherit; padding: 12px 13px; border-radius: 12px; }
.connexion input:focus { outline: none; border-color: var(--leaf); }
.connexion .go { background: var(--tomato); color: #fff; border: none; border-radius: 12px; padding: 13px; font: 600 18px var(--display); cursor: pointer; box-shadow: 0 4px 12px rgba(225,84,58,.3); }
.connexion .go:hover { filter: brightness(1.05); }
.connexion .msg { min-height: 20px; font-size: 14px; color: var(--tomato); text-align: center; }
.connexion .msg.ok { color: var(--leaf); }
.deco { background: none; border: none; color: var(--leaf); font: 600 13px var(--font); cursor: pointer; padding: 4px 0; }
.version { text-align: center; color: var(--muted); font-size: 12px; padding-top: 26px; }
</style>
</head>
<body>

<form class="connexion" id="ecran-connexion" hidden autocomplete="on">
  <div class="haut">
    <div class="fruits" aria-hidden="true">🥕🍅🥖🍋🧀</div>
    <h1>Courses</h1>
    <div class="sous">Ta liste, sur le téléphone et le PC</div>
  </div>
  <div class="corps">
    <label>E-mail<input id="email" type="email" autocomplete="username" required></label>
    <label>Mot de passe<input id="mdp" type="password" autocomplete="current-password" required></label>
    <button class="go" type="submit">Se connecter</button>
    <button class="lien" type="button" id="oubli">Mot de passe oublié ?</button>
    <div class="msg" id="msg-connexion" role="status"></div>
  </div>
</form>

<div class="page" id="ecran-liste" hidden>
  <header>
    <h1>Courses</h1>
    <span class="deco-fruits" aria-hidden="true">🥕🍅🥖</span>
    <span class="etat" id="etat">Chargement…</span>
  </header>

  <div class="fiche">
    <ul id="liste" aria-label="Articles à acheter"></ul>
    <div id="vide" class="vide" hidden>La liste est vide. Ajoute un article ci-dessous.</div>
    <form class="ajout" id="form-ajout" autocomplete="off">
      <span class="plus" aria-hidden="true">+</span>
      <input id="nouveau" type="text" placeholder="Ajouter un article ou coller une liste" aria-label="Ajouter un article" enterkeyhint="done">
    </form>
    <div class="sugg" id="sugg" aria-label="Suggestions"></div>
    <div class="outils-ajout"><button class="lien" id="ajout-titre" type="button" title="Ajoute un titre de magasin en fin de liste (le texte tapé ci-dessus devient son nom)">🏪 Ajouter un magasin</button></div>
  </div>

  <button class="bascule" id="bascule" type="button" aria-expanded="false" hidden>
    <span class="chev" aria-hidden="true"></span><span id="nb-coches"></span>
  </button>
  <div id="zone-coches" hidden>
    <div class="fiche"><ul id="coches" aria-label="Articles cochés"></ul></div>
    <div class="outils"><button class="lien rouge" id="vider" type="button">Supprimer les éléments cochés</button></div>
    <div id="confirme"></div>
  </div>
  <div class="version">Courses <span id="version"></span> — JLApplis · <button class="deco" id="deco" type="button">Se déconnecter</button></div>
</div>

<script type="module">
/*
    Courses — liste de courses (JLApplis)
    Copyright (C) 2026 Jluc — JLApplis — Licence GPL v3 (voir LICENSE)
*/
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, collection, doc, addDoc, updateDoc, deleteDoc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const VERSION = "1.4";

/* ===== CONFIGURATION FIREBASE (projet courses-e9163) ===== */
const firebaseConfig = {
  apiKey: "AIzaSyDvz52I6Qcv5dWRCo_vQ9OjB9kvmVYQwog",
  authDomain: "courses-e9163.firebaseapp.com",
  projectId: "courses-e9163",
  storageBucket: "courses-e9163.firebasestorage.app",
  messagingSenderId: "684441703323",
  appId: "1:684441703323:web:ebe67718a4265ff08e073e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
// cache local : la liste s'affiche et se modifie même sans réseau dans le magasin, puis se synchronise
const db = initializeFirestore(app, { localCache: persistentLocalCache() });

const $ = (id) => document.getElementById(id);
let UID = null, ARTS = [], HISTO = {}, ouvert = false, desabonner = [], glisse = null, aRendre = false;
try { ouvert = localStorage.getItem("courses_coches_ouvert") === "1"; } catch (e) { /* sans gravité */ }
$("version").textContent = VERSION;

const norm = (s) => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
const cle = (s) => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 120) || "x";
const colArticles = () => collection(db, "users", UID, "articles");
const refArticle = (id) => doc(db, "users", UID, "articles", id);
const refHisto = () => doc(db, "users", UID, "meta", "historique");
function etat(msg, alerte) { const e = $("etat"); e.textContent = msg || ""; e.classList.toggle("alerte", !!alerte); }
function erreur(e) { console.error(e); etat("Enregistrement impossible, réessaie", true); }

/* ---------- connexion ---------- */
$("ecran-connexion").addEventListener("submit", (e) => {
  e.preventDefault(); const m = $("msg-connexion"); m.className = "msg"; m.textContent = "Connexion…";
  signInWithEmailAndPassword(auth, $("email").value.trim(), $("mdp").value)
    .then(() => { m.textContent = ""; })
    .catch((err) => { m.textContent = /invalid-credential|wrong-password|user-not-found|invalid-email/.test(err.code) ? "E-mail ou mot de passe incorrect." : "Connexion impossible (" + err.code + ")."; });
});
$("oubli").addEventListener("click", () => {
  const m = $("msg-connexion"), mail = $("email").value.trim();
  if (!mail) { m.className = "msg"; m.textContent = "Indique d'abord ton e-mail."; return; }
  sendPasswordResetEmail(auth, mail).then(() => { m.className = "msg ok"; m.textContent = "E-mail de réinitialisation envoyé."; })
    .catch((err) => { m.className = "msg"; m.textContent = "Envoi impossible (" + err.code + ")."; });
});
$("deco").addEventListener("click", () => signOut(auth));

onAuthStateChanged(auth, (u) => {
  desabonner.forEach((f) => f()); desabonner = []; ARTS = []; HISTO = {};
  UID = u ? u.uid : null;
  $("ecran-connexion").hidden = !!u; $("ecran-liste").hidden = !u;
  if (!u) return;
  etat("Chargement…"); rendre();
  const minuteur = setTimeout(() => etat("Hors ligne — les changements seront envoyés au retour du réseau", true), 10000);
  desabonner.push(onSnapshot(colArticles(), { includeMetadataChanges: true }, (snap) => {
    ARTS = snap.docs.map((d) => { const x = d.data(); return { id: d.id, texte: String(x.texte || ""), coche: !!x.coche, ordre: x.ordre || 0, cocheLe: x.cocheLe || 0, titre: x.type === "titre" }; });
    if (!snap.metadata.fromCache) { clearTimeout(minuteur); etat(snap.metadata.hasPendingWrites ? "Enregistrement…" : "À jour"); }
    if (!glisse) rendre(); else aRendre = true;
  }, (err) => { clearTimeout(minuteur); etat("Liste injoignable (" + err.code + ")", true); }));
  desabonner.push(onSnapshot(refHisto(), (s) => {
    const t = s.exists() ? (s.data().termes || {}) : {}; HISTO = {};
    Object.keys(t).forEach((k) => { if (t[k] && t[k].t) HISTO[k] = { t: String(t[k].t), n: Number(t[k].n) || 1 }; });
    suggerer();
  }, () => { /* suggestions indisponibles : la liste fonctionne quand même */ }));
});

/* ---------- affichage ---------- */
function bouton(cls, texte, titre, action) {
  const b = document.createElement("button"); b.type = "button"; b.className = cls; b.textContent = texte; b.title = titre; b.setAttribute("aria-label", titre);
  b.addEventListener("click", action); return b;
}
function ligne(a, deplacable) {
  const li = document.createElement("li"); li.className = "art" + (a.coche ? " coche" : "") + (a.titre ? " titre" : ""); li.dataset.id = a.id;
  const elts = [];
  if (deplacable) {
    const h = document.createElement("span"); h.className = "poignee"; h.textContent = "⠿"; h.title = "Glisser pour déplacer"; h.setAttribute("aria-hidden", "true");
    h.addEventListener("pointerdown", (e) => debutGlisse(e, li)); elts.push(h);
  }
  if (!a.titre) {
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = a.coche; cb.setAttribute("aria-label", (a.coche ? "Décocher " : "Cocher ") + a.texte);
    cb.addEventListener("change", () => cocher(a.id, cb.checked)); elts.push(cb);
  }
  const t = document.createElement("input"); t.className = "txt"; t.value = a.texte; t.id = "txt-" + a.id; t.setAttribute("aria-label", a.titre ? "Magasin" : "Article");
  t.addEventListener("keydown", (e) => { if (e.key === "Enter") t.blur(); });
  t.addEventListener("change", () => renommer(a.id, t.value)); elts.push(t);
  if (deplacable) {
    const fl = document.createElement("span"); fl.className = "fleches";
    fl.append(bouton("fl", "▲", "Monter " + a.texte, () => deplacer(a.id, -1)), bouton("fl", "▼", "Descendre " + a.texte, () => deplacer(a.id, 1)));
    elts.push(fl);
  }
  elts.push(bouton("suppr", "×", "Supprimer " + a.texte, () => supprimer(a.id)));
  li.append(...elts); return li;
}
const enListe = () => ARTS.filter((a) => !a.coche).sort((a, b) => a.ordre - b.ordre);
function rendre() {
  const actif = document.activeElement && document.activeElement.classList.contains("txt") ? document.activeElement.id : null;
  const aFaire = enListe();
  const faits = ARTS.filter((a) => a.coche && !a.titre).sort((a, b) => b.cocheLe - a.cocheLe);
  $("liste").replaceChildren(...aFaire.map((a) => ligne(a, true)));
  $("coches").replaceChildren(...faits.map((a) => ligne(a, false)));
  $("vide").hidden = aFaire.some((a) => !a.titre);
  $("bascule").hidden = !faits.length;
  $("nb-coches").textContent = faits.length + " élément" + (faits.length > 1 ? "s" : "") + " coché" + (faits.length > 1 ? "s" : "");
  $("bascule").setAttribute("aria-expanded", String(ouvert && faits.length > 0)); $("zone-coches").hidden = !(ouvert && faits.length);
  if (actif && $(actif)) $(actif).focus();
  suggerer();
}

/* ---------- suggestions : articles déjà achetés, les plus fréquents d'abord ---------- */
function suggerer() {
  const q = norm($("nouveau").value), deja = {};
  ARTS.forEach((a) => { if (!a.coche && !a.titre) deja[cle(a.texte)] = 1; });
  const l = Object.keys(HISTO).map((k) => ({ k, t: HISTO[k].t, n: HISTO[k].n || 1 }))
    .filter((h) => !deja[h.k] && q && norm(h.t).indexOf(q) >= 0 && norm(h.t) !== q)
    .sort((a, b) => {
      const pa = norm(a.t).indexOf(q) === 0 ? 0 : 1, pb = norm(b.t).indexOf(q) === 0 ? 0 : 1;
      return pa - pb || b.n - a.n || (norm(a.t) < norm(b.t) ? -1 : 1);
    }).slice(0, 8);
  $("sugg").replaceChildren(...l.map((h) => {
    const b = document.createElement("button"); b.type = "button"; b.textContent = h.t; b.title = "Acheté " + h.n + " fois";
    const s = document.createElement("small"); s.textContent = "×" + h.n; b.appendChild(s);
    b.addEventListener("click", () => ajouter(h.t)); return b;
  }));
}

/* ---------- écritures ---------- */
function memoriser(texte) {
  const k = cle(texte), n = ((HISTO[k] && HISTO[k].n) || 0) + 1;
  HISTO[k] = { t: texte.trim(), n };
  return setDoc(refHisto(), { termes: { [k]: { t: texte.trim(), n } } }, { merge: true });
}
function ajouter(texte, ordre) {
  texte = String(texte || "").trim(); if (!texte || !UID) return Promise.resolve();
  $("nouveau").value = ""; suggerer(); $("nouveau").focus();
  const exist = ARTS.find((a) => !a.titre && cle(a.texte) === cle(texte));
  // déjà dans la liste cochée : on le remet à acheter au lieu de créer un doublon
  const p = exist ? (exist.coche ? updateDoc(refArticle(exist.id), { coche: false }) : Promise.resolve())
                  : addDoc(colArticles(), { texte, coche: false, ordre: ordre || Date.now() });
  return p.then(() => memoriser(texte)).catch(erreur);
}

/* ---------- collage de plusieurs lignes (ex. ingrédients copiés depuis ASSPER) ---------- */
const UNITES = "kg|g|gr|grammes?|mg|l|litres?|cl|dl|ml|c\\.?\\s?à\\s?(?:soupe|café|s|c)\\.?|cuill(?:è|e)res?\\s+à\\s+(?:soupe|café)|cs|cc|tasses?|verres?|pincées?|brins?|branches?|bottes?|gousses?|tranches?|feuilles?|morceaux?|boîtes?|sachets?|pots?|paquets?|noix|filets?|zestes?|poignées?|bouquets?|briques?|bouteilles?";
const RE_QTE = new RegExp("^(?:environ\\s+|quelques\\s+)?[\\d\\s.,/½¼¾⅓⅔-]*\\d[\\d\\s.,/½¼¾⅓⅔]*\\s*(?:(?:" + UNITES + ")(?=[\\s.']|$)\\.?)?\\s*", "i");
// « 200 g de beurre » → « Beurre » ; « 4 osso bucco (1,2 kg) » → « Osso bucco »
function produit(ligne) {
  let s = String(ligne || "").replace(/^\s*[-•*·–—]\s*/, "").replace(/^\d+[.)]\s+(?=\D)/, "").replace(/\([^)]*\)/g, " ").replace(/\s+/g, " ").trim();
  s = s.replace(RE_QTE, "").replace(/^(?:de\s+la\s+|de\s+l['’]\s*|de\s+|d['’]\s*|des\s+|du\s+)/i, "").replace(/[.;]+$/, "").trim();
  if (s.length > 2 && s === s.toUpperCase()) s = s.toLowerCase();       // « OSSO BUCCO » → « osso bucco »
  return s ? s.charAt(0).toUpperCase() + s.slice(1) : "";
}
async function ajouterPlusieurs(lignes) {
  const vus = new Set(), liste = [];
  lignes.forEach((l) => {
    if (/^\s*ingr[ée]dients?\b/i.test(l) || /:\s*$/.test(l)) return;   // titres
    const p = produit(l); if (p.length < 2 || vus.has(cle(p))) return;
    vus.add(cle(p)); liste.push(p);
  });
  if (!liste.length) return;
  etat("Ajout de " + liste.length + " article" + (liste.length > 1 ? "s" : "") + "…");
  const base = Date.now();
  for (let i = 0; i < liste.length; i++) await ajouter(liste[i], base + i);   // un à la fois, dans l'ordre
}
function cocher(id, val) { updateDoc(refArticle(id), val ? { coche: true, cocheLe: Date.now() } : { coche: false }).catch(erreur); }
function ajouterTitre() {
  if (!UID) return;
  const texte = $("nouveau").value.trim() || "Magasin";
  $("nouveau").value = ""; suggerer();
  addDoc(colArticles(), { texte, type: "titre", coche: false, ordre: Date.now() }).then((r) => {
    setTimeout(() => { const t = $("txt-" + r.id); if (t) { t.focus(); t.select(); } }, 150);
  }).catch(erreur);
}
/* ---------- déplacer : flèches et glisser ---------- */
// groupe = un magasin et ses articles (jusqu'au magasin suivant) ; un article seul = groupe d'un élément
function groupeDe(id, liste) {
  const i = liste.findIndex((a) => a.id === id); if (i < 0) return [];
  if (!liste[i].titre) return [id];
  const g = [id];
  for (let k = i + 1; k < liste.length && !liste[k].titre; k++) g.push(liste[k].id);
  return g;
}
function placer(groupe, ids) {   // ids = ordre voulu de la liste, après déplacement ; groupe = éléments déplacés (consécutifs)
  const l = enListe(), parId = Object.fromEntries(l.map((a) => [a.id, a]));
  const i0 = ids.indexOf(groupe[0]), i1 = ids.indexOf(groupe[groupe.length - 1]);
  const avant = parId[ids[i0 - 1]], apres = parId[ids[i1 + 1]], n = groupe.length;
  const bas = avant ? avant.ordre : (apres ? apres.ordre - 1000 * (n + 1) : Date.now());
  const haut = apres ? apres.ordre : bas + 1000 * (n + 1);
  const maj = [];
  groupe.forEach((id, k) => {
    const o = bas + (haut - bas) * (k + 1) / (n + 1), x = parId[id];
    if (x && x.ordre !== o) { x.ordre = o; maj.push([id, o]); }
  });
  if (!maj.length) return;
  rendre();                     // affichage immédiat
  maj.forEach(([id, o]) => updateDoc(refArticle(id), { ordre: o }).catch(erreur));
}
function deplacer(id, sens) {
  const l = enListe(), ids = l.map((a) => a.id), a = l.find((x) => x.id === id); if (!a) return;
  if (!a.titre) {                                   // article : un cran
    const i = ids.indexOf(id), j = i + sens;
    if (j < 0 || j >= ids.length) return;
    ids.splice(i, 1); ids.splice(j, 0, id); placer([id], ids);
  } else {                                          // magasin : saute le magasin voisin, avec ses articles
    const g = groupeDe(id, l), i0 = ids.indexOf(g[0]);
    const reste = ids.filter((x) => !g.includes(x));
    const titres = l.filter((x) => x.titre && !g.includes(x.id)).map((x) => x.id);
    let pos;                                        // index d'insertion dans « reste », toujours devant un magasin ou en fin
    if (sens < 0) {
      const prec = titres.filter((t) => ids.indexOf(t) < i0).pop(); if (!prec) return;
      pos = reste.indexOf(prec);
    } else {
      const suiv = titres.find((t) => ids.indexOf(t) > i0); if (!suiv) return;
      const apres = titres.find((t) => ids.indexOf(t) > ids.indexOf(suiv));
      pos = apres ? reste.indexOf(apres) : reste.length;
    }
    reste.splice(pos, 0, ...g); placer(g, reste);
  }
  setTimeout(() => { const b = document.querySelector('li[data-id="' + id + '"] .fl:' + (sens < 0 ? "first-child" : "last-child")); if (b) b.focus(); }, 0);
}
function debutGlisse(e, li) {
  if (e.button !== undefined && e.button !== 0) return;
  e.preventDefault();
  const ul = li.parentNode, groupe = groupeDe(li.dataset.id, enListe());
  const lis = groupe.map((id) => ul.querySelector('li[data-id="' + id + '"]')).filter(Boolean);
  const estTitre = li.classList.contains("titre");
  glisse = { ul };
  lis.forEach((x) => x.classList.add("glisse")); document.body.classList.add("en-glisse");
  const bouge = (ev) => {
    const y = ev.clientY;
    if (y < 70) window.scrollBy(0, -12); else if (y > window.innerHeight - 70) window.scrollBy(0, 12);
    // un magasin ne se pose que devant un autre magasin ou en fin de liste (pour ne pas couper un groupe)
    const autres = [...ul.children].filter((x) => !lis.includes(x) && (!estTitre || x.classList.contains("titre")));
    const cible = autres.find((x) => { const r = x.getBoundingClientRect(); return y < r.top + r.height / 2; });
    const dernier = lis[lis.length - 1];
    if (cible) { if (dernier.nextSibling !== cible) lis.forEach((x) => ul.insertBefore(x, cible)); }
    else if (ul.lastChild !== dernier) lis.forEach((x) => ul.appendChild(x));
  };
  const fin = () => {
    window.removeEventListener("pointermove", bouge); window.removeEventListener("pointerup", fin); window.removeEventListener("pointercancel", fin);
    lis.forEach((x) => x.classList.remove("glisse")); document.body.classList.remove("en-glisse");
    const ids = [...ul.children].map((x) => x.dataset.id);
    glisse = null;
    placer(groupe, ids);
    if (aRendre) { aRendre = false; rendre(); }
  };
  window.addEventListener("pointermove", bouge); window.addEventListener("pointerup", fin); window.addEventListener("pointercancel", fin);
}
function renommer(id, texte) {
  texte = texte.trim();
  if (!texte) { supprimer(id); return; }
  const a = ARTS.find((x) => x.id === id);
  updateDoc(refArticle(id), { texte }).then(() => (a && a.titre) ? null : memoriser(texte)).catch(erreur);
}
function supprimer(id) { deleteDoc(refArticle(id)).catch(erreur); }

/* ---------- événements ---------- */
$("form-ajout").addEventListener("submit", (e) => { e.preventDefault(); ajouter($("nouveau").value); });
$("nouveau").addEventListener("input", suggerer);
$("ajout-titre").addEventListener("click", ajouterTitre);
$("nouveau").addEventListener("paste", (e) => {
  const t = (e.clipboardData || window.clipboardData).getData("text") || "";
  const lignes = t.replace(/\r/g, "").split("\n").map((l) => l.trim()).filter(Boolean);
  if (lignes.length < 2) return;            // une seule ligne : collage normal dans le champ
  e.preventDefault(); ajouterPlusieurs(lignes);
});
$("bascule").addEventListener("click", () => { ouvert = !ouvert; try { localStorage.setItem("courses_coches_ouvert", ouvert ? "1" : "0"); } catch (e) { /* sans gravité */ } rendre(); });
$("vider").addEventListener("click", () => {
  const ids = ARTS.filter((a) => a.coche).map((a) => a.id); if (!ids.length) return;
  const c = $("confirme"); c.replaceChildren();
  const box = document.createElement("div"); box.className = "confirme";
  const s = document.createElement("span"); s.textContent = "Supprimer les " + ids.length + " éléments cochés ? Ils resteront proposés en suggestion.";
  const non = document.createElement("button"); non.className = "non"; non.type = "button"; non.textContent = "Annuler"; non.onclick = () => c.replaceChildren();
  const oui = document.createElement("button"); oui.className = "oui"; oui.type = "button"; oui.textContent = "Supprimer";
  oui.onclick = () => { c.replaceChildren(); Promise.all(ids.map((id) => deleteDoc(refArticle(id)))).catch(erreur); };
  box.append(s, non, oui); c.appendChild(box);
});
